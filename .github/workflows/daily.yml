name: Daily AQI snapshot

on:
  schedule:
    - cron: "17 3 * * *" # 08:47 IST — the daily snapshot
    # Backup: a no-op if the morning run stored all cities (rows are deduped
    # on date+city); otherwise fills the gap left by a dropped/failed run.
    - cron: "17 6 * * *" # 11:47 IST
  workflow_dispatch:
    inputs:
      past_days:
        description: "Past days of full-day stats to fetch (1-92). Days already stored are kept as-is; use 92 once to backfill history."
        type: number
        default: 1
      since:
        description: "Optional: also backfill full-day stats back to this date (YYYY-MM-DD) via backfill.py. It stops by itself where the archive ends."
        type: string
        default: ""

permissions:
  contents: write
  issues: write # alerts.py opens/comments/closes "aqi-alert" issues

concurrency:
  group: daily-aqi
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Generous enough for a long backfill; the backfill step has its own,
    # shorter timeout so a slow archive can't take the whole job down.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        id: tests
        run: pytest -q

      - name: Fetch AQI
        id: fetch
        env:
          # Scheduled runs have no inputs, so this falls back to 1.
          PAST_DAYS: ${{ inputs.past_days || 1 }}
        run: python fetch.py --past-days "$PAST_DAYS"

      # A step timeout marks the step failed (not cancelled), so the steps
      # below still run and commit whatever was backfilled so far; a re-run
      # resumes from the oldest stored day. A *job* timeout would cancel
      # everything and lose it all.
      - name: Backfill older history
        id: backfill
        if: ${{ inputs.since != '' && steps.tests.outcome == 'success' }}
        timeout-minutes: 25
        env:
          SINCE: ${{ inputs.since }}
        run: python backfill.py --since "$SINCE"

      # The steps below also run when fetch.py failed part-way (e.g. one city
      # returned no AQI): whatever rows it did store still get committed.
      # The last step then turns the job red.
      - name: Draw chart
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python make_chart.py

      - name: Monthly reports
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python report.py

      - name: Update README
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python update_readme.py

      - name: Commit and push if changed
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          git config user.name "Georgian-86"
          git config user.email "140907660+Georgian-86@users.noreply.github.com"
          git add data/ README.md
          # reports/ only exists once a month has completed with enough data.
          if [ -d reports ]; then git add reports/; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: AQI snapshot $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      # The chart goes to a separate `charts` branch holding exactly one commit,
      # replaced each run, so daily PNGs don't accumulate in main's history
      # (~150 KB/day, which compresses poorly). Plumbing commands reuse the
      # checkout's credentials, and the push is skipped if the image is
      # unchanged.
      - name: Publish chart
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          blob=$(git hash-object -w charts/aqi_trend.png)
          if git fetch -q --depth=1 origin charts 2>/dev/null &&
             [ "$(git rev-parse FETCH_HEAD:aqi_trend.png)" = "$blob" ]; then
            echo "Chart unchanged."
            exit 0
          fi
          tree=$(printf '100644 blob %s\taqi_trend.png\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "chart: $(TZ=Asia/Kolkata date +%F)")
          git push -f origin "$commit:refs/heads/charts"

      # After the commit, so an alerts failure can't block saving data.
      - name: Update alert issues
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python alerts.py

      - name: Fail if fetch failed
        if: ${{ !cancelled() && steps.fetch.outcome == 'failure' }}
        run: |
          echo "::error::fetch.py failed; see the 'Fetch AQI' step. Any rows it stored were committed."
          exit 1
